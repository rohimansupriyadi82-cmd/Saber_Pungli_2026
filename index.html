<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spanduk Saber Pungli 2026</title>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #121826;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --btn: #1f2937;
        --btnHover: #243042;
        --accent: #22c55e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        min-height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      header {
        padding: 14px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(18, 24, 38, 0.85);
        backdrop-filter: blur(6px);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .title {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 240px;
      }
      .title strong {
        font-size: 14px;
        letter-spacing: 0.2px;
      }
      .title span {
        font-size: 12px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      input[type="file"] {
        display: none;
      }
      button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: var(--btn);
        color: var(--text);
        padding: 9px 12px;
        border-radius: 10px;
        font-weight: 600;
        letter-spacing: 0.2px;
        cursor: pointer;
        transition: background 120ms ease, transform 80ms ease;
      }
      button:hover {
        background: var(--btnHover);
      }
      button:active {
        transform: translateY(1px);
      }
      button.primary {
        background: rgba(34, 197, 94, 0.16);
        border-color: rgba(34, 197, 94, 0.55);
      }
      button.primary:hover {
        background: rgba(34, 197, 94, 0.22);
      }
      main {
        padding: 18px 16px 22px;
        display: grid;
        place-items: center;
      }
      .stage {
        width: min(1400px, 100%);
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 14px;
        padding: 14px;
      }
      .banner {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 10px;
        background: #0b0f14;
        outline: 1px solid rgba(255, 255, 255, 0.08);
      }
      .hint {
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.45;
      }
      .hint code {
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 6px;
        border-radius: 8px;
        color: #fff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .status {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        font-size: 12px;
        color: var(--text);
        display: none;
      }
      .status.show {
        display: block;
      }
      footer {
        padding: 12px 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--muted);
        font-size: 12px;
      }
      @media print {
        header,
        footer {
          display: none !important;
        }
        body {
          background: #fff;
        }
        main {
          padding: 0;
        }
        .stage {
          padding: 0;
          border: none;
          background: transparent;
        }
        .banner {
          border-radius: 0;
          outline: none;
        }
        .hint,
        .status {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="bar">
          <div class="title">
            <strong>Pratinjau Spanduk</strong>
            <span>Saber Pungli 2026 - Repositori GitHub</span>
          </div>
          <div class="actions">
            <button class="primary" id="btnPrint" type="button">Cetak (Print)</button>
            <button id="btnDownload" type="button">Unduh PNG</button>
            <button id="btnPdf" type="button">Unduh PDF 3×1 m</button>
            <button id="btnPick" type="button">Ganti Gambar</button>
            <input id="fileInput" type="file" accept="image/*" />
          </div>
        </div>
      </header>

      <main>
        <div class="stage" id="stage">
          <img class="banner" id="banner" alt="Spanduk" src="spanduk.png" />
          
          <div class="hint">
            File saat ini: <code>spanduk.png</code>. Jika gambar tidak muncul, pastikan file gambar di GitHub Anda bernama persis <strong>spanduk.png</strong> (huruf kecil semua).
          </div>
          <div class="status" id="status" aria-live="polite"></div>
        </div>
      </main>

      <footer>Tip: Gunakan tombol "Cetak" untuk hasil PDF dengan skala 100%.</footer>
    </div>

    <script>
      // Seluruh Script JS Anda tetap berfungsi normal dengan file yang terpanggil
      const img = document.getElementById("banner");
      const stage = document.getElementById("stage");
      const btnPrint = document.getElementById("btnPrint");
      const btnDownload = document.getElementById("btnDownload");
      const btnPdf = document.getElementById("btnPdf");
      const btnPick = document.getElementById("btnPick");
      const fileInput = document.getElementById("fileInput");
      const statusEl = document.getElementById("status");
      let objectUrl = null;
      let currentFileName = "spanduk.png";
      let lastLoadedFile = null;

      const SPANDUK_WIDTH_MM = 3000;
      const SPANDUK_HEIGHT_MM = 1000;

      const setStatus = (message, { show = true } = {}) => {
        if (!statusEl) return;
        statusEl.textContent = message || "";
        statusEl.classList.toggle("show", Boolean(show && message));
      };

      const mmToPt = (mm) => (mm * 72) / 25.4;
      const formatPt = (n) => Number(n).toFixed(3);

      const downloadBlob = (blob, fileName) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.download = fileName || "spanduk";
        a.href = url;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      };

      const getCurrentImageBlob = async () => {
        if (lastLoadedFile) return lastLoadedFile;
        const src = img.currentSrc || img.src;
        try {
          const res = await fetch(src);
          if (!res.ok) return null;
          return await res.blob();
        } catch {
          return null;
        }
      };

      const blobToUint8 = async (blob) => new Uint8Array(await blob.arrayBuffer());

      const canvasToJpegBlob = (canvas, quality = 0.98) =>
        new Promise((resolve) => canvas.toBlob((b) => resolve(b), "image/jpeg", quality));

      const buildPdfFromJpeg = ({ jpegBytes, imgPixelWidth, imgPixelHeight }) => {
        const pageW = mmToPt(SPANDUK_WIDTH_MM);
        const pageH = mmToPt(SPANDUK_HEIGHT_MM);
        const pageAspect = pageW / pageH;
        const imgAspect = imgPixelWidth / imgPixelHeight;

        let drawW = pageW;
        let drawH = pageH;
        let x = 0;
        let y = 0;

        if (imgAspect >= pageAspect) {
          drawH = pageH;
          drawW = pageH * imgAspect;
          x = (pageW - drawW) / 2;
          y = 0;
        } else {
          drawW = pageW;
          drawH = pageW / imgAspect;
          x = 0;
          y = (pageH - drawH) / 2;
        }

        const content =
          `q\n` +
          `0 0 ${formatPt(pageW)} ${formatPt(pageH)} re W n\n` +
          `${formatPt(drawW)} 0 0 ${formatPt(drawH)} ${formatPt(x)} ${formatPt(y)} cm\n` +
          `/Im0 Do\n` +
          `Q\n`;

        const encoder = new TextEncoder();
        const text = (s) => encoder.encode(s);
        const binHeader = new Uint8Array([0xe2, 0xe3, 0xcf, 0xd3]);

        const objects = [];
        const obj1 = text(`1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n`);
        const obj2 = text(`2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n`);
        const obj3 = text(
          `3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${formatPt(pageW)} ${formatPt(
            pageH
          )}] /Resources << /XObject << /Im0 4 0 R >> /ProcSet [/PDF /ImageC] >> /Contents 5 0 R >>\nendobj\n`
        );

        const imgDict = text(
          `4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${Math.round(imgPixelWidth)} /Height ${Math.round(
            imgPixelHeight
          )} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`
        );
        const imgEnd = text(`\nendstream\nendobj\n`);
        const contentBytes = text(content);
        const contentObjStart = text(`5 0 obj\n<< /Length ${contentBytes.length} >>\nstream\n`);
        const contentObjEnd = text(`\nendstream\nendobj\n`);

        const header = new Uint8Array(text("%PDF-1.4\n%").length + binHeader.length + text("\n").length);
        header.set(text("%PDF-1.4\n%"), 0);
        header.set(binHeader, text("%PDF-1.4\n%").length);
        header.set(text("\n"), text("%PDF-1.4\n%").length + binHeader.length);

        let size = header.length;
        const chunks = [header];
        const objOffsets = [0];

        const push = (u8) => { chunks.push(u8); size += u8.length; };
        const startObj = () => { objOffsets.push(size); };

        startObj(); push(obj1);
        startObj(); push(obj2);
        startObj(); push(obj3);
        startObj(); push(imgDict); push(jpegBytes); push(imgEnd);
        startObj(); push(contentObjStart); push(contentBytes); push(contentObjEnd);

        const xrefStart = size;
        const xrefLines = ["xref\n", "0 6\n", "0000000000 65535 f \n"];
        for (let i = 1; i <= 5; i++) {
          xrefLines.push(String(objOffsets[i]).padStart(10, "0") + " 00000 n \n");
        }

        const trailer = `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF\n`;
        push(text(xrefLines.join("")));
        push(text(trailer));

        const out = new Uint8Array(size);
        let cursor = 0;
        for (const c of chunks) {
          out.set(c, cursor);
          cursor += c.length;
        }
        return out;
      };

      const loadFile = (file) => {
        if (!file || !file.type.startsWith("image/")) return;
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        lastLoadedFile = file;
        objectUrl = URL.createObjectURL(file);
        currentFileName = file.name;
        img.src = objectUrl;
      };

      btnPrint.addEventListener("click", () => window.print());
      btnPick.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", (e) => loadFile(e.target?.files?.[0]));

      img.addEventListener("load", () => {
        const dpiW = img.naturalWidth / (SPANDUK_WIDTH_MM / 25.4);
        const dpiH = img.naturalHeight / (SPANDUK_HEIGHT_MM / 25.4);
        setStatus(`Siap: ${img.naturalWidth}x${img.naturalHeight} | DPI: ${Math.round(dpiW)}`);
      });

      img.addEventListener("error", () => {
        setStatus("Gagal memuat spanduk.png. Pastikan file ada di GitHub.");
      });

      btnDownload.addEventListener("click", async () => {
        const blob = await getCurrentImageBlob();
        if (blob) downloadBlob(blob, currentFileName);
      });

      btnPdf.addEventListener("click", async () => {
        btnPdf.disabled = true;
        try {
          const blob = await getCurrentImageBlob();
          let jpegBytes;
          if (blob && blob.type === "image/jpeg") {
            jpegBytes = await blobToUint8(blob);
          } else {
            const canvas = document.createElement("canvas");
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            canvas.getContext("2d").drawImage(img, 0, 0);
            const jpegBlob = await canvasToJpegBlob(canvas);
            jpegBytes = await blobToUint8(jpegBlob);
          }
          const pdfBytes = buildPdfFromJpeg({ jpegBytes, imgPixelWidth: img.naturalWidth, imgPixelHeight: img.naturalHeight });
          downloadBlob(new Blob([pdfBytes], { type: "application/pdf" }), "spanduk-3x1m.pdf");
        } finally {
          btnPdf.disabled = false;
        }
      });
    </script>
  </body>
</html>
